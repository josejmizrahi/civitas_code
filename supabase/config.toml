project_id = "civitas-local"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "https://civitas-code.vercel.app"]
jwt_expiry = 3600
enable_signup = true
# Leaked password protection (HaveIBeenPwned). Enable in Dashboard for hosted project.
# password_protection = true  # Not supported by CLI v2.75, enabled in Dashboard

[auth.email]
enable_signup = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "50MiB"

# send-email: require JWT (user session or service role). Invoked from app (user JWT) and from reset-password (service role).
[functions.send-email]
verify_jwt = true

# reset-password: called by unauthenticated users (forgot password). Must stay public; rate-limit at gateway if needed.
[functions.reset-password]
verify_jwt = false

# fintoc-webhook: auth via Fintoc webhook signature. verify_jwt = false.
[functions.fintoc-webhook]
verify_jwt = false

# fintoc-checkout: creates checkout sessions. Requires user JWT.
[functions.fintoc-checkout]
verify_jwt = true

# fintoc-transfer: initiates outbound transfers. Requires user JWT.
[functions.fintoc-transfer]
verify_jwt = true
